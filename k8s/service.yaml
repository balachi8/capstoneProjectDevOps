apiVersion: v1
kind: Service
metadata:
  name: capstone-project-service
  namespace: myworkspace
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: capstone-project
  ports:
    - name: capstone-service-port
      protocol: TCP
      port: 9090
      targetPort: 9090
      nodePort: 30080